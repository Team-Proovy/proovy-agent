repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check   # 린터 (자동 수정 가능한 건 수정, 불가능한 건 commit 블록)
        args: [--fix]
      - id: ruff-format  # 포매터

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml              # YAML 문법 검사
      - id: check-toml              # TOML 문법 검사 (pyproject.toml 등)
      - id: check-json              # JSON 문법 검사
      - id: end-of-file-fixer       # 파일 끝 개행 보장
      - id: trailing-whitespace     # 줄 끝 공백 제거
      - id: check-merge-conflict    # merge 충돌 마커 감지
      - id: no-commit-to-branch     # main 직접 commit 방지
        args: [--branch, main]
